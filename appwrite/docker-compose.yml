x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: 10m

services:
  traefik:
    image: traefik:3.6
    <<: *default-logging
    container_name: appwrite-traefik
    command:
      - --providers.file.directory=/storage/config
      - --providers.file.watch=true
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.constraint-label-stack`,`appwrite`)
      - --entrypoints.appwrite_web.address=:80
      - --entrypoints.appwrite_websecure.address=:443
    ports:
      - ${_APP_HTTP_PORT:-80}:80
      - ${_APP_HTTPS_PORT:-443}:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite-config:/storage/config:ro
      - appwrite-certificates:/storage/certificates:ro
    depends_on:
      - appwrite
      - fastapi-gateway
      - frontend
    networks:
      - gateway
      - appwrite

  frontend:
    image: nginx:1.25-alpine
    <<: *default-logging
    container_name: appwrite-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - appwrite
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=appwrite
      - traefik.docker.network=appwrite
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.http.routers.frontend_http.entrypoints=appwrite_web
      - traefik.http.routers.frontend_http.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend_http.service=frontend
      - traefik.http.routers.frontend_http.priority=100
      - traefik.http.routers.frontend_https.entrypoints=appwrite_websecure
      - traefik.http.routers.frontend_https.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend_https.service=frontend
      - traefik.http.routers.frontend_https.priority=100
      - traefik.http.routers.frontend_https.tls=true

  fastapi-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *default-logging
    container_name: fastapi-gateway
    restart: unless-stopped
    depends_on:
      redis-lock:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APPWRITE_ENDPOINT=http://appwrite/v1
      - REDIS_LOCK_HOST=redis-lock
      - REDIS_LOCK_PORT=6379
      - MONGO_URI=mongodb://root:${_APP_DB_ROOT_PASS}@mongodb:27017/${_APP_DB_SCHEMA}?authSource=admin
    networks:
      - appwrite
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=appwrite
      - traefik.docker.network=appwrite
      - traefik.http.services.fastapi_api.loadbalancer.server.port=8000
      - traefik.http.routers.fastapi_api_http.entrypoints=appwrite_web
      - traefik.http.routers.fastapi_api_http.rule=PathPrefix(`/api`)
      - traefik.http.routers.fastapi_api_http.service=fastapi_api
      - traefik.http.routers.fastapi_api_http.priority=1500
      - traefik.http.routers.fastapi_api_https.entrypoints=appwrite_websecure
      - traefik.http.routers.fastapi_api_https.rule=PathPrefix(`/api`)
      - traefik.http.routers.fastapi_api_https.service=fastapi_api
      - traefik.http.routers.fastapi_api_https.priority=1500
      - traefik.http.routers.fastapi_api_https.tls=true

  appwrite:
    container_name: appwrite
    <<: *default-logging
    image: ${_APP_IMAGE:-appwrite/appwrite}:${_APP_VERSION:-latest}
    healthcheck:
      test: ["CMD", "doctor"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - appwrite
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=appwrite
      - traefik.docker.network=appwrite
      - traefik.http.services.appwrite_api.loadbalancer.server.port=80
      - traefik.http.routers.appwrite_api_http.entrypoints=appwrite_web
      - traefik.http.routers.appwrite_api_http.rule=PathPrefix(`/v1`)
      - traefik.http.routers.appwrite_api_http.service=appwrite_api
      - traefik.http.routers.appwrite_api_http.priority=1000
      - traefik.http.routers.appwrite_api_https.entrypoints=appwrite_websecure
      - traefik.http.routers.appwrite_api_https.rule=PathPrefix(`/v1`)
      - traefik.http.routers.appwrite_api_https.service=appwrite_api
      - traefik.http.routers.appwrite_api_https.priority=1000
      - traefik.http.routers.appwrite_api_https.tls=true
    volumes:
      - appwrite-uploads:/storage/uploads:rw
      - appwrite-cache:/storage/cache:rw
      - appwrite-config:/storage/config:rw
      - appwrite-certificates:/storage/certificates:rw
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - _APP_DB_HOST=mongodb
      - _APP_DB_PORT=27017
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_OPTIONS_FUNCTIONS=enabled
      - _APP_OPTIONS_STORAGE=enabled
      - _APP_OPTIONS_DATABASES=enabled
      - _APP_OPTIONS_GRAPHQL=enabled

  appwrite-console:
    <<: *default-logging
    container_name: appwrite-console
    image: appwrite/console:8.7.5
    restart: unless-stopped
    networks:
      - appwrite
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=appwrite
      - traefik.docker.network=appwrite
      - traefik.http.services.appwrite_console.loadbalancer.server.port=80
      - traefik.http.routers.appwrite_console_http.entrypoints=appwrite_web
      - traefik.http.routers.appwrite_console_http.rule=PathPrefix(`/console`)
      - traefik.http.routers.appwrite_console_http.service=appwrite_console
      - traefik.http.routers.appwrite_console_http.priority=2000
      - traefik.http.routers.appwrite_console_https.entrypoints=appwrite_websecure
      - traefik.http.routers.appwrite_console_https.rule=PathPrefix(`/console`)
      - traefik.http.routers.appwrite_console_https.service=appwrite_console
      - traefik.http.routers.appwrite_console_https.priority=2000
      - traefik.http.routers.appwrite_console_https.tls=true

  appwrite-worker-mails:
    entrypoint: worker-mails
    <<: *default-logging
    container_name: appwrite-worker-mails
    image: ${_APP_IMAGE:-appwrite/appwrite}:${_APP_VERSION:-latest}
    networks:
      - appwrite
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - _APP_DB_HOST=mongodb
      - _APP_REDIS_HOST=redis

  appwrite-worker-deletes:
    entrypoint: worker-deletes
    <<: *default-logging
    container_name: appwrite-worker-deletes
    image: ${_APP_IMAGE:-appwrite/appwrite}:${_APP_VERSION:-latest}
    networks:
      - appwrite
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
    volumes:
      - appwrite-uploads:/storage/uploads:rw
      - appwrite-cache:/storage/cache:rw
    env_file:
      - .env
    environment:
      - _APP_DB_HOST=mongodb
      - _APP_REDIS_HOST=redis

  appwrite-task-interval:
    entrypoint: interval
    restart: on-failure:3
    <<: *default-logging
    container_name: appwrite-task-interval
    image: ${_APP_IMAGE:-appwrite/appwrite}:${_APP_VERSION:-latest}
    networks:
      - appwrite
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - _APP_DB_HOST=mongodb
      - _APP_REDIS_HOST=redis

  mongodb:
    image: mongo:8.2.5
    container_name: appwrite-mongodb
    <<: *default-logging
    restart: on-failure:3
    networks:
      - appwrite
    volumes:
      - appwrite-mongodb:/data/db
      - appwrite-mongodb-keyfile:/data/keyfile
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${_APP_DB_ROOT_PASS}
      - MONGO_INITDB_DATABASE=${_APP_DB_SCHEMA}
      - MONGO_INITDB_USERNAME=${_APP_DB_USER}
      - MONGO_INITDB_PASSWORD=${_APP_DB_PASS}
    entrypoint:
      - /bin/bash
      - /mongo-entrypoint.sh
    healthcheck:
      test: |
        bash -c "
          mongosh -u root -p ${_APP_DB_ROOT_PASS} --authenticationDatabase admin --quiet --eval \"
            try {
              const hello = db.adminCommand({hello: 1});
              if (hello.isWritablePrimary) {
                quit(0);
              }
            } catch (e) {}
            try {
              rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'appwrite-mongodb:27017'}]});
            } catch (e) {}
            quit(1);
          \" 2>/dev/null
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4.7-alpine
    <<: *default-logging
    container_name: appwrite-redis
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --maxmemory-samples
      - "5"
    networks:
      - appwrite
    volumes:
      - appwrite-redis:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-lock:
    image: redis:7.4.7-alpine
    <<: *default-logging
    container_name: appwrite-redis-lock
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    networks:
      - appwrite
    volumes:
      - appwrite-redis-lock:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  gateway:
    name: gateway
  appwrite:
    name: appwrite

volumes:
  appwrite-mongodb: ~
  appwrite-mongodb-keyfile: ~
  appwrite-redis: ~
  appwrite-redis-lock: ~
  appwrite-cache: ~
  appwrite-uploads: ~
  appwrite-certificates: ~
  appwrite-config: ~